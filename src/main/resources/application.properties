quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOSTNAME}/${POSTGRES_DB}

quarkus.flyway.migrate-at-start=true
# The existing database was created by Hibernate (without Flyway).
# Mark it as version 1 instead of failing; empty databases still run V1.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.smallrye-openapi.info-title=Punchclock API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Dokumentation der Schnittstelle des Übungsprojekts Punchclock

quarkus.http.cors.enabled=true

punchclock.example-data.enabled=false
%dev.punchclock.example-data.enabled=true

# JWT
mp.jwt.verify.issuer=https://zli.ch/punchclock
smallrye.jwt.new-token.issuer=https://zli.ch/punchclock
# 8 hours
smallrye.jwt.new-token.lifespan=28800
# Key pair in src/main/resources (ignored by git, see .gitignore).
# Can be overridden with the environment variables JWT_PUBLIC_KEY_LOCATION / JWT_PRIVATE_KEY_LOCATION.
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}

# Adds an "Authorize" button for the JWT to Swagger UI
quarkus.smallrye-openapi.security-scheme=jwt
